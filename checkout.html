<!DOCTYPE HTML>
<html>
<head>
    <link href="store.css" type="text/css" rel="stylesheet">
	<title>G&A Checkout</title>
	<script>
    </script>
</head>
<body>
    <h1>Checkout</h1>
    <button onclick="goBackHome()" class="home-button">Home</button>
    <form id="checkoutForm">
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="address">Shipping Address:</label>
        <textarea id="address" name="address" rows="4" required></textarea>

        <label for="cardNumber">Credit Card Number:</label>
        <input type="text" id="cardNumber" name="cardNumber" pattern="[0-9]{16}" placeholder="16 digits, no spaces" required>

        <label for="expiryDate">Expiry Date:</label>
        <input type="text" id="expiryDate" name="expiryDate" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" placeholder="MM/YY" required>

        <label for="cvv">CVV:</label>
        <input type="text" id="cvv" name="cvv" pattern="[0-9]{3}" placeholder="3 digits" required>

        <button type="submit">Place Order</button>
    </form>
    <script>
        function goBackHome(){
			window.location.href = 'http://18.207.115.190/runningstore/';
		}
    </script>
</body>
</html>
