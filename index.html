<!DOCTYPE HTML>
<html>
<head>
	<link href="store.css" type="text/css" rel="stylesheet">
	<title>G&A</title>
	<script>
		function getShoes(){
			theURL = "http://18.207.115.190/runphp/getshoes.php";
			fetch( theURL )										//get the raw answer
				.then( res => res.json() )						//get structure
				.then( data => displayShoes( data ) );			//convert and show
		}
		
		function displayShoes( theArray ){
			element = 0;
			cell = 0;
			shoeTitle = "";
			price = "$";
			shoeName = "";
			gender = "";
			text = "<h2>Running Shoes</h2>\n<table>\n";
			theArray.forEach(function( item ){
				if(cell == 0){
					text+= "<tr>";
				}
				item.forEach(function( elem ){
					switch (element){
						case 0:
							text += "<td><p>" + elem; 
							gender = elem; 
							shoeTitle += gender;
							break;
						case 1:
							text += " " + elem;
							shoeTitle += " " + elem;
							break;
						case 2:
							text += " " + elem; 
							shoeName = elem; 
							shoeTitle += " " + elem;
							break;
						case 3:
							text += "<br>$" + elem + "</p>";
							price += elem;
							break;
						case 4:
							text += getImage(elem) + getSizes(shoeName, gender) + "</td>"; 
							element = -1; 
							break;
					}
					element++;
				});
				cell++;
				if(cell == 3){
					text+="</tr>\n";
					cell = 0;
				}
			});
			text+="</table>\n"
			document.getElementById( 'theShoes' ).innerHTML = text;
		}

		function getImage( element ){
			imageText = '<img src=\"' + element + '" class=\"grow\">';
			return imageText;
		}

		function getSizes(shoeName, gender){
			theURL = 'http://18.207.115.190/runphp/getshoes.php?shoe=\"' + shoeName + '\"&gender=\"'+ gender + '\"';
			text = "";
			fetch( theURL )									//get the raw answer
				.then( res => res.json() )						//get structure
				.then( data => displaySizes( data ) );			//convert and show
		}

		function displaySizes( theArray ){
			count = 0;
			size = "";
			text = '<form id=\"addToCartForm\" onsubmit=\"addToCart(); return false;\">\n';
			text += '<label for=\"shoeSize\">Shoe Size:</label>\n<select id=\"shoeSize\" name=\"shoeSize\">\n';
			theArray.forEach(function( item ){
				text += '<option value=\"';
				item.forEach(function( elem ){
					switch(count){
						case 0:
							text += elem + '\" data-quantity=\"';
							size = elem;
							break;
						case 1:
							text += elem + '\">US ' + size + '(' + elem + ' available)</option>';
							count = -1;
							break;
					}
					count ++;
				});
			});
			text += '</select>\n<button type=\"submit\" class=\"cart-button\">Add to Cart</button>\n</form>';
			return text;
		}
	</script>
</head>
<body onload="getShoes()">
	<h1>G&A Running Shoe Store</h1>
	<a href="checkout.html" id="cartButton" class="cart-button">Go to Checkout (0 items)</a>
	<div id="theShoes"></div>
	<script>
		let cartCount = 0;

		function addToCart(productName, price) {
			// Cart logic
			alert('Added ' + productName + ' to cart. Price: $' + price);

			// Update the cart count and button text
			updateCartCount(++cartCount);
		}

		function updateCartCount(count) {
			// Update the cart button text with the current count
			const cartButton = document.getElementById('cartButton');
			cartButton.textContent = `Go to Checkout (${count} item${count !== 1 ? 's' : ''})`;
		}
	</script>
</body>
</html>
